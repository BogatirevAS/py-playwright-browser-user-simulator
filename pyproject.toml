[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbus"
dynamic = ["version"]
description = "Async Playwright wrapper with custom class wrapping, stealth mode and simplified browser lifecycle management."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
keywords = [
    "playwright",
    "playwright-stealth",
    "browser-automation",
    "web-scraping",
    "stealth",
    "anti-detect",
    "async",
    "asyncio",
    "browser-wrapper",
    "scraping",
    "automation",
    "persistent-context",
]
authors = [
  { name = "Bogatyrev Aleksandr", email = "bogatirevas.dev@gmail.com" },
]
maintainers = [
  { name = "Bogatyrev Aleksandr", email = "bogatirevas.dev@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "logger @ git+https://github.com/BogatirevAS/py-logger.git@0.1.1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "playwright>=1.40,<2",
    "playwright-stealth>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-mock>=3.14,<4",
    "pytest-env>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[project.urls]
Documentation = "https://github.com/BogatiterAS/py-playwright-browser-user-simulator#readme"
Issues = "https://github.com/BogatiterAS/py-playwright-browser-user-simulator/issues"
Source = "https://github.com/BogatiterAS/py-playwright-browser-user-simulator"

[tool.hatch.version]
path = "src/pbus/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pbus"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s"
testpaths = ["tests"]
markers = [
    "integration: tests that launch a real browser",
    "slow: long-running tests",
    "unit: tests without a browser (pure logic/configuration)",
]
filterwarnings = ["ignore::DeprecationWarning"]
